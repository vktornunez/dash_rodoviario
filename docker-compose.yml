version: '3.8'

services:
  # Serviço do Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: dash_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: dash_rodoviario
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  # Serviço do Backend (FastAPI)
  backend:
    build: .
    container_name: dash_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # Passando as variáveis separadas para o seu config.py ler
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=dash_rodoviario
      - DB_USER=admin
      - DB_PASS=adminpassword

  # Serviço do Frontend (Nginx para servir os arquivos estáticos)
  frontend:
    image: nginx:alpine
    container_name: dash_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./scr/frontend:/usr/share/nginx/html:ro

volumes:
  pgdata: